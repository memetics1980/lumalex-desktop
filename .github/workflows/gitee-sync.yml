name: Sync Gitee

on:
  push:
    branches: [main]
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to sync, latest for the newest release, or empty for code only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: gitee-sync
  cancel-in-progress: false

jobs:
  sync:
    if: vars.GITEE_SYNC_ENABLED == 'true' && github.repository == 'memetics1980/lumalex-desktop' && (github.event_name != 'release' || !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTTP client
        run: python -m pip install requests==2.32.5
      - name: Check mirror safety behavior
        run: python -m unittest discover -s tools -p 'test_sync_gitee.py' -v
      - name: Sync code and requested release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: python tools/sync_gitee.py
